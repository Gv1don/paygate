networks:
  paygate-network:
    driver: bridge

services:
  traefik:
    image: traefik:v3.0
    container_name: paygate-traefik
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./gateway/traefik:/etc/traefik/dynamic:ro"
    networks:
      - paygate-network

  scylladb:
    image: scylladb/scylla:5.4
    container_name: paygate-scylladb
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    networks:
      - paygate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paygate-backend
    environment:
      SERVER_PORT: "8081"
      SCYLLA_ADDR: "scylladb:9042"
      SCYLLA_KEYSPACE: "paygate"
      BANK_API_URL: "https://bankapi.example.com"
      BANK_SECRET: "${BANK_SECRET:-change_me}"
      THREE_DS_RETURN_URL: "${THREE_DS_RETURN_URL:-http://localhost/api/v1/payments/3ds-return}"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "*"
      SWAGGER_HOST: "localhost:8081"
      FRONTEND_URL: "http://localhost"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
    depends_on:
      - scylladb
    networks:
      - paygate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paygate-frontend
    depends_on:
      - backend
    networks:
      - paygate-network

volumes:
  scylla-data:
